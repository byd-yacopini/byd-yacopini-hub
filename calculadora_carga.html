<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Yacopini &middot; Calculadora de Carga</title>
<style>
  :root{
    --negro:#0A0A0A;
    --carbon:#2A2A2A;
    --gris-oscuro:#4A4A4A;
    --gris-medio:#8C8C8C;
    --gris-claro:#D4D4D4;
    --gris-fondo:#F2F2F2;
    --blanco:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--gris-fondo); color:var(--negro); font-family:'Segoe UI', Arial, Helvetica, sans-serif; }
  .app{ max-width:640px; margin:0 auto; padding:0 0 90px; }
  .app-topbar{ background:var(--negro); padding:20px 20px; display:flex; align-items:center; justify-content:space-between; }
  .app-topbar svg{ height:32px; width:auto; display:block; }
  .title-block{ padding:20px 20px 6px; }
  .title-block h1{ font-size:21px; font-weight:800; margin:0 0 4px; color:var(--negro); }
  .title-block p{ font-size:12.5px; color:var(--gris-oscuro); margin:0; line-height:1.5; }
  .compare-selectors{ display:flex; gap:12px; padding:4px 20px 16px; }
  .compare-select-group{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .compare-select-group label{ font-size:11px; font-weight:700; color:var(--gris-oscuro); text-transform:uppercase; letter-spacing:.04em; }
  .compare-select-group select{ padding:10px 10px; border-radius:8px; border:1px solid var(--gris-claro); background:var(--blanco); font-size:13.5px; color:var(--negro); font-weight:600; font-family:inherit; width:100%; }
  .carga-wrap{ padding:0 20px 28px; }
  .carga-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .carga-chip{ background:var(--blanco); border:1px solid var(--gris-claro); border-radius:20px; padding:6px 12px; font-size:12px; font-weight:700; color:var(--carbon); }
  .carga-chip.si{ border-color:#B5E0C5; background:#E3F5EA; color:#145C37; }
  .carga-chip.no{ border-color:#E7B8B8; background:#FBEAEA; color:#8A2020; }
  .carga-aviso{ background:#FFF7E6; border:1px solid #F0D48A; color:#7A5A00; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; }
  .carga-aviso.error{ background:#FBEAEA; border-color:#E7B8B8; color:#8A2020; }
  .carga-hero{ background:var(--negro); color:#fff; border-radius:16px; padding:16px 18px; margin:0 0 14px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .carga-hero .m{ font-size:17px; font-weight:800; line-height:1.2; }
  .carga-hero .c{ font-size:12px; color:#C9CED6; margin-top:3px; line-height:1.4; }
  .carga-hero .kw{ text-align:right; flex:none; }
  .carga-hero .kw b{ display:block; font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .carga-hero .kw span{ font-size:11px; color:#C9CED6; }
  .carga-leyenda{ display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; font-weight:700; color:var(--gris-oscuro); margin:0 2px 10px; }
  .carga-leyenda i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .escenario{ background:var(--blanco); border:1px solid var(--gris-claro); border-radius:14px; padding:14px 16px 16px; margin-bottom:12px; }
  .esc-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .esc-top .desde{ font-size:12px; font-weight:700; color:var(--gris-oscuro); text-transform:uppercase; letter-spacing:.04em; }
  .esc-top .desde b{ display:block; font-size:26px; letter-spacing:0; color:var(--negro); line-height:1.1; font-variant-numeric:tabular-nums; }
  .esc-top .tiempo{ text-align:right; }
  .esc-top .tiempo b{ display:block; font-size:28px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; }
  .esc-top .tiempo span{ font-size:11.5px; color:var(--gris-medio); }
  .esc-barra{ height:14px; border-radius:8px; background:var(--gris-fondo); overflow:hidden; }
  .esc-barra > div{ height:100%; border-radius:8px; }
  .esc-bateria{ margin-top:10px; display:flex; align-items:center; gap:8px; font-size:11px; color:var(--gris-medio); font-weight:600; }
  .esc-bateria .pista{ flex:1; height:8px; border-radius:5px; background:var(--gris-fondo); position:relative; overflow:hidden; }
  .esc-bateria .pista > div{ position:absolute; top:0; bottom:0; border-radius:5px; opacity:.85; }
  .esc-rojo .tiempo b{ color:#C0392B; } .esc-rojo .esc-barra > div, .esc-rojo .pista > div{ background:#C0392B; }
  .esc-azul .tiempo b{ color:#1565D8; } .esc-azul .esc-barra > div, .esc-azul .pista > div{ background:#1565D8; }
  .esc-verde .tiempo b{ color:#1B7F4C; } .esc-verde .esc-barra > div, .esc-verde .pista > div{ background:#1B7F4C; }
  .esc-rojo{ border-left:5px solid #C0392B; } .esc-azul{ border-left:5px solid #1565D8; } .esc-verde{ border-left:5px solid #1B7F4C; }
  .carga-nota{ font-size:11.5px; color:var(--gris-medio); line-height:1.5; margin:14px 2px 0; }

  /* Embebida dentro de Fichas Técnicas: el hub ya pone logo, título y botón de volver. */
  .embebido .app-topbar, .embebido .title-block, .embebido #hubBackBtn{ display:none !important; }
  .embebido body, body.embebido{ background:transparent; }
  .embebido .app{ max-width:none; padding-bottom:12px; }
  @media (min-width:900px){ .app{ max-width:760px; } }
</style>
<script src="tema.js"></script>
</head>
<body>

      <path class="st0" d="M520.08,15.93c-13.35-9.58-27.85-10.94-39.61-11.21-11.58-.27-29.05-.39-44.5-.45-37.67-.15-15.02-.08-50.91-.08v19.6c38.19,0,64.97-.32,94.46.52,8.66.24,17.95,1.16,26.31,6.96,7.92,5.5,12.62,14.26,12.62,23.72s-4.57,18.24-12.49,23.74c-8.36,5.81-17.65,6.72-26.31,6.96-29.49.83-56.27.51-94.46.51l-.13,19.59c38.41,0,66.03.14,95.41-.54,11.76-.27,26.26-1.63,39.61-11.21,12.67-9.09,20.33-23.36,20.33-39.05s-7.67-29.97-20.33-39.05"/>
      <path class="st0" d="M227.22,48.06c-10.23-.2-13.49-3.54-13.56-13.73-.07-9.42-.02-20.58-.02-30.14h-22.56c0,9.67-.19,29.24.19,38.7.74,18.38,6.77,24.11,25.55,24.75,13.02.44,23.36.29,41.36.28v-19.69c-14.43,0-20.31.04-30.96-.16"/>
      <path class="st0" d="M339.04,34.68c-.07,9.92-3.3,13.18-13.56,13.38-4.89.09-17.75.14-28.33.16h0s-.1.01-.1.01c-10.81,0-22.34-.02-29.1-.02v57.57h26.52v-37.88c.81,0,1.68,0,2.58,0h0s.1,0,.1,0v.02c13.8,0,31.04-.06,37.55-.26,19.93-.61,26-6.23,26.73-24.78.1-2.48.16-5.62.19-9.06V4.18h-22.56c0,9.8.04,20.81-.03,30.5"/>

<div class="app">
  <div class="title-block">
    <h1>Calculadora de Carga</h1>
    <p>Cuánto tarda en cargar cada modelo con cada tipo de cargador.</p>
  </div>
  <div id="view-carga">
    <div class="carga-wrap">
      <div class="compare-selectors" style="padding:4px 0 12px;">
        <div class="compare-select-group">
          <label for="cargaModelo">Modelo</label>
          <select id="cargaModelo"></select>
        </div>
        <div class="compare-select-group">
          <label for="cargaCargador">Tipo de cargador</label>
          <select id="cargaCargador"></select>
        </div>
      </div>
      <div class="carga-chips" id="cargaChips"></div>
      <div id="cargaResultado"></div>
      <p class="carga-nota" id="cargaNota"></p>
    </div>
  </div>

</div>
<a id="hubBackBtn" href="./index.html" style="position:fixed;bottom:18px;left:18px;z-index:999999;width:44px;height:44px;border-radius:50%;background:#0A0A0A;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:Arial,sans-serif;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,0.3);" aria-label="Volver">&larr;</a>
<script>
// ---------- Calculadora de Carga ----------
// Los datos de cada modelo (bateria, si acepta AC / DC y potencia maxima) se cargan en la planilla
// "CARGA BYD - Datos de vehiculos" (publicada como CSV): se lee en vivo y, si no se puede, se usa esta copia.
(function(){
  var URL_CARGA_CSV = '';   // se completa al publicar la planilla
  var COPIA = [
    { modelo:'Dolphin Mini GL', bateria:30.08, ac:true,  pAC:11, dc:true,  pDC:45 },
    { modelo:'Dolphin Mini GS', bateria:43.2,  ac:true,  pAC:11, dc:true,  pDC:45 },
    { modelo:'Yuan Pro',        bateria:45.12, ac:true,  pAC:7,  dc:true,  pDC:45 },
    { modelo:'Atto 2 DM-i',     bateria:18.03, ac:true,  pAC:7,  dc:false, pDC:0 },
    { modelo:'Song Pro GL',     bateria:12.9,  ac:true,  pAC:7,  dc:false, pDC:0 },
    { modelo:'Song Pro GS',     bateria:18.3,  ac:true,  pAC:7,  dc:false, pDC:0 },
    { modelo:'Seal 5 DM-i',     bateria:7.68,  ac:true,  pAC:7,  dc:false, pDC:0 },
    { modelo:'Seal U DM-i GS',  bateria:18.3,  ac:true,  pAC:7,  dc:false, pDC:0 },
    { modelo:'Shark',           bateria:29.58, ac:true,  pAC:7,  dc:true,  pDC:45 },
    { modelo:'Ti 7 DM-p',       bateria:null,  ac:true,  pAC:7,  dc:true,  pDC:45 }
  ];
  var CARGADORES = [
    { nombre:'Enchufe domiciliario (2,2 kW)', tipo:'AC', kw:2.2 },
    { nombre:'Wallbox monofásico (7 kW)',     tipo:'AC', kw:7 },
    { nombre:'Wallbox trifásico (22 kW)',     tipo:'AC', kw:22 },
    { nombre:'Cargador DC 30 kW',             tipo:'DC', kw:30 },
    { nombre:'Cargador DC 40 kW',             tipo:'DC', kw:40 },
    { nombre:'Cargador DC 60 kW',             tipo:'DC', kw:60 },
    { nombre:'Cargador DC 120 kW',            tipo:'DC', kw:120 }
  ];
  var INICIOS = [5, 50, 80];
  // Supuestos: perdidas del cargador a bordo (AC) y de conversion (DC); en DC la potencia cae al acercarse al tope.
  var EFIC = { AC: 0.90, DC: 0.95 };
  var DC_TRAMO_1 = 0.90;   // 0-80%: potencia promedio como fraccion del pico
  var DC_TRAMO_2 = 0.35;   // 80-100%: potencia promedio como fraccion del pico

  var VEHICULOS = COPIA, ORIGEN = 'copia';
  var selM = document.getElementById('cargaModelo'), selC = document.getElementById('cargaCargador');
  var chips = document.getElementById('cargaChips'), res = document.getElementById('cargaResultado'), nota = document.getElementById('cargaNota');
  function esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function num(s){ if (s == null) return null; var n = parseFloat(String(s).trim().replace(',', '.')); return isNaN(n) ? null : n; }
  function fmtKw(n){ return (n % 1 ? n.toFixed(1).replace('.', ',') : String(n)); }

  function formatoTiempo(horas){
    var min = Math.round(horas * 60);
    if (min < 1) return 'menos de 1 min';
    var h = Math.floor(min / 60), m = min % 60;
    if (h === 0) return m + ' min';
    return h + ' h' + (m ? ' ' + (m < 10 ? '0' : '') + m + ' min' : '');
  }
  // Horas para cargar desde 'inicio' % hasta 100% con potencia pico 'kw' (ya limitada por auto y cargador).
  function horas(bateria, inicio, tipo, kw){
    var ef = EFIC[tipo];
    function tramo(a, b, frac){ var e = bateria * (b - a) / 100; return e > 0 ? e / (kw * frac * ef) : 0; }
    if (tipo === 'AC') return tramo(inicio, 100, 1);
    return tramo(inicio, 80, DC_TRAMO_1) + tramo(Math.max(inicio, 80), 100, DC_TRAMO_2);
  }

  function dibujar(){
    var v = VEHICULOS[+selM.value], c = CARGADORES[+selC.value];
    if (!v || !c){ res.innerHTML = ''; chips.innerHTML = ''; return; }
    chips.innerHTML =
      '<span class="carga-chip">' + (v.bateria ? 'Batería ' + fmtKw(v.bateria) + ' kWh' : 'Batería sin dato') + '</span>' +
      '<span class="carga-chip ' + (v.ac ? 'si' : 'no') + '">AC ' + (v.ac ? 'hasta ' + fmtKw(v.pAC) + ' kW' : 'no admite') + '</span>' +
      '<span class="carga-chip ' + (v.dc ? 'si' : 'no') + '">DC ' + (v.dc ? 'hasta ' + fmtKw(v.pDC) + ' kW' : 'no admite') + '</span>';
    var admite = c.tipo === 'AC' ? v.ac : v.dc, pAuto = c.tipo === 'AC' ? v.pAC : v.pDC;
    if (!v.bateria){
      res.innerHTML = '<div class="carga-aviso">Todavía no está cargada la capacidad de batería de <b>' + esc(v.modelo) + '</b>. Completala en la planilla de carga y se actualiza sola.</div>';
      return;
    }
    if (!admite || !pAuto){
      res.innerHTML = '<div class="carga-aviso error"><b>' + esc(v.modelo) + '</b> no admite carga ' + c.tipo + ': no se puede usar con este cargador. ' +
        (c.tipo === 'DC' ? 'Probá con un cargador AC.' : 'Probá con un cargador DC si el modelo lo admite.') + '</div>';
      return;
    }
    var pico = Math.min(c.kw, pAuto), limita = c.kw > pAuto ? 'el auto' : (c.kw < pAuto ? 'el cargador' : 'ambos');
    var datos = INICIOS.map(function(ini){
      return { ini: ini, kwh: v.bateria * (100 - ini) / 100, h: horas(v.bateria, ini, c.tipo, pico) };
    });
    // El que mas tarda en rojo, el del medio en azul y el que menos en verde.
    var orden = datos.slice().sort(function(a, b){ return b.h - a.h; });
    var CLASES = ['esc-rojo', 'esc-azul', 'esc-verde'];
    orden.forEach(function(d, i){ d.clase = CLASES[i]; });
    var maxH = orden[0].h || 1;
    var filas = datos.map(function(d){
      var ancho = Math.max(4, Math.round(d.h / maxH * 100));
      return '<div class="escenario ' + d.clase + '">' +
        '<div class="esc-top"><div class="desde">Batería al<b>' + d.ini + '%</b></div>' +
        '<div class="tiempo"><b>' + formatoTiempo(d.h) + '</b><span>hasta 100% · ' + fmtKw(Math.round(d.kwh * 10) / 10) + ' kWh</span></div></div>' +
        '<div class="esc-barra"><div style="width:' + ancho + '%"></div></div>' +
        '<div class="esc-bateria"><span>' + d.ini + '%</span><div class="pista"><div style="left:' + d.ini + '%;right:0"></div></div><span>100%</span></div>' +
        '</div>';
    }).join('');
    var nota = '(' + (limita === 'ambos' ? 'el cargador y el auto coinciden en ' + fmtKw(pico) + ' kW en ' + c.tipo
      : 'la limita ' + limita + ': cargador ' + fmtKw(c.kw) + ' kW · auto ' + fmtKw(pAuto) + ' kW en ' + c.tipo) + ')';
    res.innerHTML =
      '<div class="carga-hero"><div><div class="m">' + esc(v.modelo) + '</div><div class="c">' + esc(c.nombre) + '<br>' + esc(nota) + '</div></div>' +
      '<div class="kw"><b>' + fmtKw(pico) + '</b><span>kW de carga</span></div></div>' +
      '<div class="carga-leyenda"><span><i style="background:#C0392B"></i>El que más tarda</span><span><i style="background:#1565D8"></i>Intermedio</span><span><i style="background:#1B7F4C"></i>El más rápido</span></div>' + filas;
  }

  function llenarSelects(){
    selM.innerHTML = VEHICULOS.map(function(v, i){ return '<option value="' + i + '">' + esc(v.modelo) + '</option>'; }).join('');
    selC.innerHTML = CARGADORES.map(function(c, i){ return '<option value="' + i + '">' + esc(c.nombre) + '</option>'; }).join('');
    selC.selectedIndex = 1;   // wallbox monofasico: lo mas comun
  }
  function textoNota(){
    nota.textContent = 'Tiempos estimados hasta el 100%, con eficiencia de carga del ' + Math.round(EFIC.AC * 100) + '% en AC y ' + Math.round(EFIC.DC * 100) +
      '% en DC. En DC la potencia baja al acercarse al 100%, por eso el tramo final es el más lento. Dependen de la temperatura y del estado de la batería. ' +
      (ORIGEN === 'planilla' ? 'Datos tomados de la planilla de carga.' : 'Datos de la última copia guardada.');
  }

  // Lee la planilla publicada (CSV). Columnas por titulo.
  function csvAFilas(texto){
    var filas = [], fila = [], cel = '', q = false;
    for (var i = 0; i < texto.length; i++){
      var ch = texto[i];
      if (q){ if (ch === '"'){ if (texto[i + 1] === '"'){ cel += '"'; i++; } else q = false; } else cel += ch; }
      else if (ch === '"') q = true;
      else if (ch === ','){ fila.push(cel); cel = ''; }
      else if (ch === '\n'){ fila.push(cel); filas.push(fila); fila = []; cel = ''; }
      else if (ch !== '\r') cel += ch;
    }
    if (cel !== '' || fila.length){ fila.push(cel); filas.push(fila); }
    return filas;
  }
  function desdeCsv(texto){
    var f = csvAFilas(texto); if (f.length < 2) return null;
    var h = f[0].map(function(x){ return x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); });
    function col(re){ for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return -1; }
    var cM = col(/^modelo/), cB = col(/^bateria/), cAC = col(/acepta carga ac/), cPAC = col(/potencia maxima ac/), cDC = col(/acepta carga dc/), cPDC = col(/potencia maxima dc/);
    if (cM < 0 || cB < 0) return null;
    var out = [];
    f.slice(1).forEach(function(r){
      var nombre = (r[cM] || '').trim(); if (!nombre) return;
      var ac = /^s/i.test((r[cAC] || '').trim()), dc = /^s/i.test((r[cDC] || '').trim());
      out.push({ modelo: nombre, bateria: num(r[cB]), ac: ac, pAC: ac ? num(r[cPAC]) || 0 : 0, dc: dc, pDC: dc ? num(r[cPDC]) || 0 : 0 });
    });
    return out.length ? out : null;
  }

  llenarSelects(); dibujar(); textoNota();
  selM.addEventListener('change', dibujar); selC.addEventListener('change', dibujar);
  if (URL_CARGA_CSV){
    fetch(URL_CARGA_CSV + (URL_CARGA_CSV.indexOf('?') === -1 ? '?' : '&') + 'nocache=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(t){
        var datos = desdeCsv(t); if (!datos) throw new Error('planilla vacia');
        var m = selM.value, c = selC.value;
        VEHICULOS = datos; ORIGEN = 'planilla';
        llenarSelects(); selM.value = Math.min(+m, VEHICULOS.length - 1); selC.value = c; dibujar(); textoNota();
      }).catch(function(){ /* se queda con la copia guardada */ });
  }
})();
</script>
<script>
(function(){
  var b = document.getElementById('hubBackBtn');
  try {
    if (b && sessionStorage.getItem('bydJefeOk') === '1') b.href = './panel_jefe.html';
    else if (b && sessionStorage.getItem('bydVendorOk') === '1') b.href = './panel_ventas.html';
  } catch (e) {}
  // Embebida en Fichas Técnicas: le avisa al marco cuánto mide para que no queden dos barras de scroll.
  if (new URLSearchParams(location.search).get('embebido') === '1') {
    document.documentElement.classList.add('embebido'); document.body.classList.add('embebido');
    var avisar = function(){ parent.postMessage({ tipo: 'alto-carga', alto: Math.ceil(document.documentElement.scrollHeight) }, '*'); };
    new ResizeObserver(avisar).observe(document.body);
    window.addEventListener('load', avisar); avisar();
  }
})();
