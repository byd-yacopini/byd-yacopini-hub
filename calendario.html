<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Yacopini &middot; Calendario</title>
<style>
  :root{
    --negro:#0A0A0A;
    --carbon:#2A2A2A;
    --gris-oscuro:#4A4A4A;
    --gris-medio:#8C8C8C;
    --gris-claro:#D4D4D4;
    --gris-fondo:#F2F2F2;
    --blanco:#FFFFFF;
    --azul-ev:#1565D8;
    --verde:#388E3C;
    --ambar:#D89614;
    --rojo:#C0392B;
    --morado:#6A3FA0;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--gris-fondo); color:var(--negro); font-family:'Segoe UI', Arial, Helvetica, sans-serif; }
  .app{ max-width:640px; margin:0 auto; padding:0 0 90px; }
  .app-topbar{ background:var(--negro); padding:20px 20px; display:flex; align-items:center; justify-content:space-between; }
  .app-topbar svg{ height:32px; width:auto; display:block; }

  .title-block{ padding:20px 20px 4px; }
  .title-block h1{ font-size:21px; font-weight:800; margin:0 0 4px; color:var(--negro); }
  .title-block p{ font-size:12.5px; color:var(--gris-oscuro); margin:0; line-height:1.5; }

  .estado{ margin:14px 20px 0; padding:9px 12px; border-radius:8px; font-size:11.5px; line-height:1.5; }
  .estado.cargando{ background:#EEF2F6; border:1px solid #D6DEE6; color:var(--gris-oscuro); }
  .estado.error{ background:#FBEAEA; border:1px solid #E7B8B8; color:#8A2020; }
  .estado.oculto{ display:none; }

  .tcard{
    margin:18px 20px 0;
    background:var(--blanco);
    border:1px solid var(--gris-claro);
    border-radius:14px;
    padding:16px;
  }
  .tcard h2{
    font-size:12.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--gris-oscuro); font-weight:800; margin:0 0 12px;
  }

  label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:#8A97A3; margin:12px 0 5px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text],input[type=date],input[type=time],textarea,select{
    width:100%; padding:10px 11px; border:1px solid var(--gris-claro); border-radius:8px;
    font-size:14.5px; font-family:inherit; background:var(--blanco); color:var(--carbon);
  }
  textarea{ resize:vertical; min-height:52px; }
  input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--gris-medio); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 14px; border-radius:8px; font-family:inherit; font-size:13.5px; font-weight:700;
    cursor:pointer; border:1px solid var(--gris-claro); background:var(--blanco); color:var(--carbon);
  }
  .btn:hover{ background:var(--gris-fondo); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn-primary{ background:var(--negro); color:#fff; border-color:var(--negro); width:100%; margin-top:16px; padding:12px; }
  .btn-primary:hover{ background:var(--carbon); }
  .btn-sm{ padding:7px 11px; font-size:12.5px; }
  .btn-ok{ background:var(--verde); color:#fff; border-color:var(--verde); }
  .btn-danger{ background:var(--rojo); color:#fff; border-color:var(--rojo); }

  .errmsg{
    font-size:12.5px; color:#A32D2D; line-height:1.5; margin-top:10px;
    background:#FCEBEB; border:1px solid #F0C1C1; border-radius:8px; padding:9px 11px;
  }

  .datehdr{
    margin:22px 20px 8px; font-size:12.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; color:var(--gris-oscuro);
  }
  .evento{
    margin:0 20px 12px; background:var(--blanco); border:1px solid var(--gris-claro);
    border-radius:14px; padding:16px;
  }
  .evento-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .evento-hora{ font-size:20px; font-weight:800; color:var(--negro); font-variant-numeric:tabular-nums; }
  .evento-badge{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .evento-badge.asignado{ background:#E3F5EA; color:#1B7F4C; }
  .evento-badge.postulado{ background:#FCF3DF; color:#8A6412; }
  .evento-badge.rechazado{ background:#FCEBEB; color:#A32D2D; }
  .evento-ubi{
    margin-top:8px; font-size:13.5px; color:var(--carbon); display:flex; align-items:flex-start; gap:6px;
  }
  .evento-ubi a{ color:var(--azul-ev); text-decoration:none; font-weight:600; }
  .evento-ubi a:hover{ text-decoration:underline; }
  .evento-obs{ margin-top:8px; font-size:13px; color:var(--gris-oscuro); line-height:1.5; white-space:pre-wrap; }

  .chiplist{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background:var(--gris-fondo); border:1px solid var(--gris-claro); border-radius:20px; padding:5px 6px 5px 11px;
  }
  .chip button{
    border:none; background:none; color:var(--gris-medio); font-size:14px; cursor:pointer; line-height:1;
    padding:2px 4px; border-radius:50%;
  }
  .chip button:hover{ background:var(--gris-claro); color:var(--negro); }

  .subsec{ margin-top:14px; padding-top:12px; border-top:1px solid var(--gris-claro); }
  .subsec .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gris-medio); font-weight:700; margin-bottom:8px; }

  .postrow{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:7px 0; font-size:13px;
  }
  .postrow .nombre{ font-weight:700; color:var(--negro); }
  .postrow .acciones{ display:flex; gap:6px; flex:none; }

  .asignar-row{ display:flex; gap:8px; margin-top:10px; }
  .asignar-row select{ flex:1; }
  .asignar-row button{ flex:none; }

  .postular-cta{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--gris-claro);
  }
  .postular-cta .btn{ width:100%; background:var(--morado); color:#fff; border-color:var(--morado); }
  .postular-cta .btn:hover{ opacity:.9; }
  .postular-cta .btn:disabled{ background:var(--gris-claro); border-color:var(--gris-claro); color:var(--gris-medio); }

  .vacio{ margin:20px; padding:24px; background:var(--blanco); border:1px solid var(--gris-claro); border-radius:12px; text-align:center; font-size:13px; color:var(--gris-oscuro); }

  @media (min-width: 900px){
    .app{ max-width:900px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-topbar">
    <svg viewBox="12 4 529 102" xmlns="http://www.w3.org/2000/svg" aria-label="BYD Yacopini">

      <path class="st0" d="M339.04,34.68c-.07,9.92-3.3,13.18-13.56,13.38-4.89.09-17.75.14-28.33.16h0s-.1.01-.1.01c-10.81,0-22.34-.02-29.1-.02v57.57h26.52v-37.88c.81,0,1.68,0,2.58,0h0s.1,0,.1,0v.02c13.8,0,31.04-.06,37.55-.26,19.93-.61,26-6.23,26.73-24.78.1-2.48.16-5.62.19-9.06V4.18h-22.56c0,9.8.04,20.81-.03,30.5"/>
    </svg>
  </div>

  <div class="title-block">
    <h1>Calendario</h1>
    <p id="subtitulo">Eventos del mes.</p>
  </div>

  <div class="estado cargando" id="estadoMsg">Cargando eventos del mes…</div>

  <!-- Solo gerencia: alta de evento -->
  <div class="tcard oculto" id="formCard" style="display:none;">
    <h2>Nuevo evento</h2>
    <label for="inpFecha">Fecha</label>
    <input type="date" id="inpFecha">
    <label for="inpHorario">Horario</label>
    <input type="time" id="inpHorario">
    <label for="inpUbicacion">Ubicación</label>
    <input type="text" id="inpUbicacion" placeholder="Ej: Salón Yacopini, Av. San Martín 1234, Godoy Cruz">
    <label for="inpObservaciones">Observaciones</label>
    <textarea id="inpObservaciones" placeholder="Opcional"></textarea>
    <button class="btn btn-primary" id="btnCrearEvento">Crear evento</button>
    <div class="errmsg" id="formMsg" style="display:none;"></div>
  </div>

  <div id="listaEventos"></div>

  <div class="vacio" id="vacioMsg" style="display:none;">No hay eventos cargados para este mes.</div>
</div>

<a id="hubBackBtn" href="./index.html" style="position:fixed;bottom:18px;left:18px;z-index:999999;
  width:44px;height:44px;border-radius:50%;background:#0A0A0A;color:#fff;display:flex;
  align-items:center;justify-content:center;text-decoration:none;font-family:Arial,sans-serif;
  font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,0.3);">&larr;</a>

<script>
(function(){
  // Página compartida: gerencia llega desde index.html, vendedores desde
  // panel_ventas.html. Mismo patrón que ranking_vendedores.html / fichas_tecnicas.html.
  var b = document.getElementById('hubBackBtn');
  if (b && sessionStorage.getItem('bydVendorOk') === '1') { b.href = './panel_ventas.html'; }
})();
</script>
<script>
(function(){
  var TABLERO_API_URL = 'https://script.google.com/macros/s/AKfycbzTYBoM56BBMj2B-8hUG_MIuOh7r5qG4qq2sGlTRM-y6QyFm0XHqgE6XUG5OQB022iy/exec';
  var TABLERO_API_KEY = 'i4uH92SO1sFyNYi8PJ2dsGb9LDM-Xoq3';

  var esGerencia = sessionStorage.getItem('bydGateOk') === '1';
  var esVendedor = sessionStorage.getItem('bydVendorOk') === '1';
  var nombreVendedor = sessionStorage.getItem('bydVendorNombre') || '';

  var vendedoresCache = null; // [{nombre, sucursal}]
  var eventosCache = [];

  function esc(s){
    var d = document.createElement('div');
    d.textContent = (s === null || s === undefined) ? '' : String(s);
    return d.innerHTML;
  }

  function normalize(s){
    return (s || '').toString().trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function fmtFechaHeader(iso){
    var partes = String(iso).split('-');
    if (partes.length !== 3) return iso;
    var d = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
    var dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    return dias[d.getDay()] + ' ' + partes[2] + '/' + partes[1];
  }

  function mapsUrl(direccion){
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccion);
  }

  /* ---------- Vendedores (para el selector de asignación de gerencia) ---------- */
  function cargarVendedores(){
    if (vendedoresCache) return Promise.resolve(vendedoresCache);
    var url = TABLERO_API_URL + '?key=' + encodeURIComponent(TABLERO_API_KEY) + '&action=listarVendedoresHoras';
    return fetch(url, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(data){
      vendedoresCache = data.vendedores || [];
      return vendedoresCache;
    }).catch(function(){ vendedoresCache = []; return vendedoresCache; });
  }

  /* ---------- Render ---------- */
  function estadoVendedor(evento){
    if (!esVendedor || !nombreVendedor) return null;
    var norm = normalize(nombreVendedor);
    var found = (evento.asignaciones || []).find(function(a){ return normalize(a.vendedor) === norm; });
    return found ? found.estado : null;
  }

  function renderAsignacionesGerencia(evento){
    var asignados = (evento.asignaciones || []).filter(function(a){ return a.estado === 'Asignado' || a.estado === 'Aprobado'; });
    var postulados = (evento.asignaciones || []).filter(function(a){ return a.estado === 'Postulado'; });

    var html = '<div class="subsec"><div class="lbl">Van a este evento</div>';
    html += '<div class="chiplist" id="chips-' + evento.id + '">';
    if (!asignados.length) html += '<span style="font-size:12px;color:var(--gris-medio);">Todavía no asignaste a nadie</span>';
    html += asignados.map(function(a){
      return '<span class="chip">' + esc(a.vendedor) + '<button type="button" class="btn-quitar" data-evento="' + evento.id + '" data-vendedor="' + esc(a.vendedor) + '">&times;</button></span>';
    }).join('');
    html += '</div>';
    html += '<div class="asignar-row">' +
      '<select id="sel-' + evento.id + '"><option value="">— Elegí un vendedor —</option></select>' +
      '<button type="button" class="btn btn-sm" data-asignar="' + evento.id + '">Asignar</button>' +
      '</div></div>';

    if (postulados.length) {
      html += '<div class="subsec"><div class="lbl">Postulaciones pendientes</div>';
      html += postulados.map(function(a){
        return '<div class="postrow"><span class="nombre">' + esc(a.vendedor) + '</span>' +
          '<div class="acciones">' +
          '<button type="button" class="btn btn-sm btn-ok" data-aprobar="' + evento.id + '" data-vendedor="' + esc(a.vendedor) + '">Aprobar</button>' +
          '<button type="button" class="btn btn-sm btn-danger" data-rechazar="' + evento.id + '" data-vendedor="' + esc(a.vendedor) + '">Rechazar</button>' +
          '</div></div>';
      }).join('');
      html += '</div>';
    }
    return html;
  }

  function renderEstadoVendedorHtml(evento){
    var estado = estadoVendedor(evento);
    if (estado === 'Asignado' || estado === 'Aprobado') {
      return '<div class="postular-cta"><span class="evento-badge asignado">Vas a este evento</span></div>';
    }
    if (estado === 'Postulado') {
      return '<div class="postular-cta"><span class="evento-badge postulado">Postulado · pendiente de aprobación</span></div>';
    }
    if (estado === 'Rechazado') {
      return '<div class="postular-cta"><span class="evento-badge rechazado">Postulación rechazada</span></div>';
    }
    return '<div class="postular-cta"><button type="button" class="btn" data-postularme="' + evento.id + '">Postularme para ir</button></div>';
  }

  function renderEventos(eventos){
    var cont = document.getElementById('listaEventos');
    var vacioEl = document.getElementById('vacioMsg');
    if (!eventos.length) {
      cont.innerHTML = '';
      vacioEl.style.display = 'block';
      return;
    }
    vacioEl.style.display = 'none';

    var porFecha = {};
    var fechas = [];
    eventos.forEach(function(ev){
      if (!porFecha[ev.fecha]) { porFecha[ev.fecha] = []; fechas.push(ev.fecha); }
      porFecha[ev.fecha].push(ev);
    });
    fechas.sort();

    var html = '';
    fechas.forEach(function(f){
      html += '<div class="datehdr">' + esc(fmtFechaHeader(f)) + '</div>';
      porFecha[f].forEach(function(ev){
        var badge = '';
        if (esVendedor) {
          var estado = estadoVendedor(ev);
          if (estado === 'Asignado' || estado === 'Aprobado') badge = '<span class="evento-badge asignado">Asignado</span>';
          else if (estado === 'Postulado') badge = '<span class="evento-badge postulado">Postulado</span>';
        }
        html += '<div class="evento" data-id="' + ev.id + '">' +
          '<div class="evento-head"><div class="evento-hora">' + (esc(ev.horario) || '&mdash;') + '</div>' + badge + '</div>' +
          '<div class="evento-ubi">📍 <a href="' + mapsUrl(ev.ubicacion) + '" target="_blank" rel="noopener">' + esc(ev.ubicacion) + '</a></div>' +
          (ev.observaciones ? '<div class="evento-obs">' + esc(ev.observaciones) + '</div>' : '') +
          (esGerencia ? renderAsignacionesGerencia(ev) : '') +
          (esVendedor ? renderEstadoVendedorHtml(ev) : '') +
          '</div>';
      });
    });
    cont.innerHTML = html;

    if (esGerencia) {
      cargarVendedores().then(function(vendedores){
        eventos.forEach(function(ev){
          var sel = document.getElementById('sel-' + ev.id);
          if (!sel) return;
          var yaAsignados = (ev.asignaciones || []).filter(function(a){ return a.estado === 'Asignado' || a.estado === 'Aprobado'; }).map(function(a){ return normalize(a.vendedor); });
          sel.innerHTML = '<option value="">— Elegí un vendedor —</option>' +
            vendedores.filter(function(v){ return yaAsignados.indexOf(normalize(v.nombre)) === -1; })
              .map(function(v){ return '<option value="' + esc(v.nombre) + '">' + esc(v.nombre) + '</option>'; }).join('');
        });
      });
      wireGerenciaBotones();
    }
    if (esVendedor) wireVendedorBotones();
  }

  /* ---------- Acciones gerencia ---------- */
  function wireGerenciaBotones(){
    document.querySelectorAll('[data-asignar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var eventoId = btn.getAttribute('data-asignar');
        var sel = document.getElementById('sel-' + eventoId);
        var vendedor = sel.value;
        if (!vendedor) return;
        btn.disabled = true;
        llamar('asignarVendedorEvento', { eventoId: eventoId, vendedor: vendedor }).then(cargar).finally(function(){ btn.disabled = false; });
      });
    });
    document.querySelectorAll('.btn-quitar').forEach(function(btn){
      btn.addEventListener('click', function(){
        var eventoId = btn.getAttribute('data-evento');
        var vendedor = btn.getAttribute('data-vendedor');
        btn.disabled = true;
        llamar('desasignarVendedorEvento', { eventoId: eventoId, vendedor: vendedor }).then(cargar);
      });
    });
    document.querySelectorAll('[data-aprobar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var eventoId = btn.getAttribute('data-aprobar');
        var vendedor = btn.getAttribute('data-vendedor');
        btn.disabled = true;
        llamar('responderPostulacion', { eventoId: eventoId, vendedor: vendedor, aprobar: 'true' }).then(cargar);
      });
    });
    document.querySelectorAll('[data-rechazar]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var eventoId = btn.getAttribute('data-rechazar');
        var vendedor = btn.getAttribute('data-vendedor');
        btn.disabled = true;
        llamar('responderPostulacion', { eventoId: eventoId, vendedor: vendedor, aprobar: 'false' }).then(cargar);
      });
    });
  }

  /* ---------- Acciones vendedor ---------- */
  function wireVendedorBotones(){
    document.querySelectorAll('[data-postularme]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var eventoId = btn.getAttribute('data-postularme');
        btn.disabled = true;
        btn.textContent = 'Enviando…';
        llamar('postularseEvento', { eventoId: eventoId, vendedor: nombreVendedor }).then(cargar).catch(function(e){
          alert(e.message || 'No se pudo enviar la postulación');
          btn.disabled = false;
          btn.textContent = 'Postularme para ir';
        });
      });
    });
  }

  function llamar(action, params){
    var url = TABLERO_API_URL + '?key=' + encodeURIComponent(TABLERO_API_KEY) + '&action=' + action;
    Object.keys(params).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(params[k]); });
    return fetch(url, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(data){
      if (data.error) throw new Error(data.error);
      return data;
    });
  }

  /* ---------- Alta de evento (gerencia) ---------- */
  if (esGerencia) {
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('btnCrearEvento').addEventListener('click', function(){
      var msgEl = document.getElementById('formMsg');
      msgEl.style.display = 'none';
      var fecha = document.getElementById('inpFecha').value;
      var horario = document.getElementById('inpHorario').value;
      var ubicacion = document.getElementById('inpUbicacion').value.trim();
      var observaciones = document.getElementById('inpObservaciones').value.trim();
      if (!fecha) { msgEl.textContent = 'Ingresá la fecha.'; msgEl.style.display = 'block'; return; }
      if (!ubicacion) { msgEl.textContent = 'Ingresá la ubicación.'; msgEl.style.display = 'block'; return; }

      var btn = document.getElementById('btnCrearEvento');
      btn.disabled = true;
      btn.textContent = 'Creando…';
      llamar('crearEventoCalendario', { fecha: fecha, horario: horario, ubicacion: ubicacion, observaciones: observaciones, creadoPor: 'Gerencia' })
        .then(function(){
          document.getElementById('inpFecha').value = '';
          document.getElementById('inpHorario').value = '';
          document.getElementById('inpUbicacion').value = '';
          document.getElementById('inpObservaciones').value = '';
          return cargar();
        })
        .catch(function(e){ msgEl.textContent = e.message || 'No se pudo crear el evento.'; msgEl.style.display = 'block'; })
        .finally(function(){ btn.disabled = false; btn.textContent = 'Crear evento'; });
    });
  }

  /* ---------- Carga inicial ---------- */
  function cargar(){
    var url = TABLERO_API_URL + '?key=' + encodeURIComponent(TABLERO_API_KEY) + '&action=listarEventosCalendario';
    return fetch(url, {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('bad-status'); return r.json(); })
      .then(function(data){
        if (data && data.error) throw new Error(data.error);
        eventosCache = data.eventos || [];
        document.getElementById('estadoMsg').classList.add('oculto');
        renderEventos(eventosCache);
      })
      .catch(function(){
        var estadoEl = document.getElementById('estadoMsg');
        estadoEl.className = 'estado error';
        estadoEl.textContent = 'No se pudieron cargar los eventos. Probá de nuevo en un rato.';
      });
  }

  cargar();
})();
</script>
</body>
</html>
